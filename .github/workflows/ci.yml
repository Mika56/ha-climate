name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # Mirrors the ext-* requirements of composer.json plus what Symfony, Doctrine and the engine use.
          extensions: ctype, iconv, intl, mbstring, pcntl, pdo_sqlite, sqlite3, zip
          coverage: pcov
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer ci
      - name: Validate the Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync --env=test

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run ci
      - name: Check that the generated API types match the contract
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

  contract:
    name: API contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Redocly lint
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml --config api/redocly.yaml

  addon:
    name: Add-on lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./ha_climate
      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < ha_climate/Dockerfile
      - name: ShellCheck
        run: |
          find ha_climate/rootfs scripts ha_climate/assets-src docker/dev -type f \
            \( -name '*.sh' -o -name run -o -name finish \) -print0 \
            | xargs -0 shellcheck --external-sources

  image:
    name: Image (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Read the base image from build.yaml
        id: base
        run: echo "image=$(yq '.build_from.amd64' ha_climate/build.yaml)" >> "$GITHUB_OUTPUT"
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ha_climate/Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
            BUILD_ARCH=amd64
          load: true
          push: false
          tags: ha-climate:ci
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max
      - name: Start the container
        run: |
          docker run -d --name ha-climate -p 8099:8099 -e HA_CLIMATE_DEV_ALLOW_ALL=1 ha-climate:ci
      - name: Wait for the health check
        run: |
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' ha-climate)"
            echo "health: ${status}"
            [ "${status}" = healthy ] && exit 0
            sleep 3
          done
          docker logs ha-climate
          exit 1
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8099/api/health
          echo
          curl -fsS -o /dev/null -w 'GET / -> %{http_code}\n' http://127.0.0.1:8099/
      - name: Container logs
        if: always()
        run: docker logs ha-climate || true
      - name: Stop the container
        if: always()
        run: docker rm -f ha-climate || true
