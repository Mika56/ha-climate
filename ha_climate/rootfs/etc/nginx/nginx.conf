user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
        application/manifest+json image/svg+xml;

    # Everything under /api/ except the live stream goes to PHP-FPM.
    upstream php {
        server unix:/run/php/php-fpm.sock;
    }

    server {
        listen 8099 default_server;
        server_name _;

        # Only the Supervisor ingress proxy (and loopback) may connect; written by the nginx s6 service.
        include /etc/nginx/ingress-access.conf;

        root /opt/ha-climate/frontend;

        # Server-sent events: served by the engine process itself, never buffered.
        location = /api/live {
            proxy_pass http://127.0.0.1:8100;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            add_header X-Accel-Buffering no always;
            add_header Cache-Control "no-cache" always;
        }

        location /api/ {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass php;
            fastcgi_param SCRIPT_FILENAME /opt/ha-climate/app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /opt/ha-climate/app/public;
            fastcgi_read_timeout 60s;
            # Ingress identity headers (X-Remote-User-Id, -Name, -Display-Name, X-Ingress-Path) reach PHP
            # as HTTP_* server variables: fastcgi_params forwards every request header.
        }

        # Engine internals are never exposed.
        location /internal/ {
            return 404;
        }

        # Hashed build assets: cache for a year.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # The SPA shell must always be revalidated (it references the hashed assets).
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
