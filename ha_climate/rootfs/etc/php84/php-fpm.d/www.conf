[www]
user = app
group = app

listen = /run/php/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

; Keep the container environment (APP_ENV, DATABASE_URL, APP_SECRET, ...): s6's with-contenv supplies it.
clear_env = no

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Logs go to the container's stderr.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
