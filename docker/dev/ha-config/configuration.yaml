# Minimal Home Assistant configuration with fake entities to exercise the climate engine.
#
# Two rooms, each with:
#   - a generic_thermostat climate entity (its "heater" is an input_boolean) fed by a temperature sensor
#     that mirrors an input_number you edit by hand to simulate the room temperature;
#   - a window contact (input_boolean rendered as a binary_sensor of device class window);
#   - a presence input_boolean.
# Plus input_datetime.bedtime (time only) to anchor schedule slots on. There is deliberately no weather entity.
default_config:

homeassistant:
  name: HA Climate Dev
  time_zone: Europe/Paris
  unit_system: metric

input_boolean:
  living_window:
    name: Living room window open
  bedroom_window:
    name: Bedroom window open
  living_presence:
    name: Living room presence
  bedroom_presence:
    name: Bedroom presence
  living_heater:
    name: Living room heater switch
  bedroom_heater:
    name: Bedroom heater switch

input_number:
  living_temperature:
    name: Living room temperature
    min: -10
    max: 40
    step: 0.1
    initial: 19
    unit_of_measurement: "°C"
    mode: box
  bedroom_temperature:
    name: Bedroom temperature
    min: -10
    max: 40
    step: 0.1
    initial: 18
    unit_of_measurement: "°C"
    mode: box

input_datetime:
  bedtime:
    name: Bedtime
    has_date: false
    has_time: true
    initial: "22:30"

template:
  - sensor:
      - name: Living room temperature sensor
        unique_id: living_room_temperature_sensor
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ states('input_number.living_temperature') | float(0) }}"
      - name: Bedroom temperature sensor
        unique_id: bedroom_temperature_sensor
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ states('input_number.bedroom_temperature') | float(0) }}"
  - binary_sensor:
      - name: Living room window
        unique_id: living_room_window
        device_class: window
        state: "{{ is_state('input_boolean.living_window', 'on') }}"
      - name: Bedroom window
        unique_id: bedroom_window
        device_class: window
        state: "{{ is_state('input_boolean.bedroom_window', 'on') }}"

climate:
  - platform: generic_thermostat
    name: Living room heater
    unique_id: living_room_heater
    heater: input_boolean.living_heater
    target_sensor: sensor.living_room_temperature_sensor
    min_temp: 7
    max_temp: 28
    initial_hvac_mode: "off"
  - platform: generic_thermostat
    name: Bedroom heater
    unique_id: bedroom_heater
    heater: input_boolean.bedroom_heater
    target_sensor: sensor.bedroom_temperature_sensor
    min_temp: 7
    max_temp: 28
    initial_hvac_mode: "off"
