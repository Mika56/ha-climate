# Audit trail messages (ICU MessageFormat). Keys are stored in the database, parameters in `params`.
audit:
    engine:
        started: >-
            Engine started: {rooms, plural, =0 {no room} one {# room} other {# rooms}} driven,
            {timers, plural, =0 {no timer} one {# timer} other {# timers}} and
            {overrides, plural, =0 {no override} one {# override} other {# overrides}} restored.
        paused: 'HA Climate paused: nothing is sent to your devices until it resumes.'
        resumed: 'HA Climate resumed.'
    decision:
        changed: >-
            {mode, select,
            off {Switched off}
            heat {Heating set to {target, number} °C}
            cool {Cooling set to {target, number} °C}
            other {Mode changed to {mode}}}
        simulated: >-
            Paused: HA Climate would have {mode, select,
            off {{season, select, summer {turned the cooling off} other {turned the heating off}}}
            heat {set the heating to {target, number} °C}
            cool {set the cooling to {target, number} °C}
            other {changed to {mode}}}
            ({reason, select,
            schedule {{preset} schedule}
            preheat {preheating for {preset} at {at}}
            no_device {no device for this mode}
            no_schedule {no schedule}
            no_rule {no rule applies}
            vacation {vacation until {returnAt}}
            house_empty {nobody home}
            opening_open {window open}
            boost {boost until {until}}
            manual_override {manual setting until {until}}
            room_vacant {room empty}
            season_off {season off}
            other {{reason}}}). Nothing was sent.
    command:
        sent: >-
            {mode, select,
            off {{device} turned off}
            heat {{device} set to heating at {target, number} °C}
            cool {{device} set to cooling at {target, number} °C}
            other {{device} set to {mode}}}
        failed: 'Command {service} on {device} failed: {error}'
        deferred: 'Command to {device} postponed until {until}.'
    manual_change:
        detected: 'Manual change on {device}: {oldMode} {oldTemperature} → {newMode} {newTemperature}'
    evaluation:
        failed: 'The room could not be evaluated: {error}'
    maintenance:
        done: >-
            Daily maintenance: {audit, plural, =0 {no audit entry} one {# audit entry} other {# audit entries}},
            {commands, plural, =0 {no command log} one {# command log} other {# command logs}} and
            {overrides, plural, =0 {no override} one {# override} other {# overrides}} purged.
    configuration:
        reloaded: >-
            Configuration reloaded: {rooms, plural, =0 {no room} one {# room} other {# rooms}},
            {entities, plural, =0 {no entity} one {# entity} other {# entities}} watched.
        room_created: 'Room {room} created.'
        room_updated: 'Room {room} updated.'
        room_deleted: 'Room {room} deleted.'
        rooms_reordered: 'Rooms reordered.'
        preset_created: 'Preset {preset} created.'
        preset_updated: 'Preset {preset} updated.'
        preset_deleted: 'Preset {preset} deleted.'
        schedule_created: 'Schedule {schedule} created.'
        schedule_updated: 'Schedule {schedule} updated.'
        schedule_deleted: 'Schedule {schedule} deleted.'
        schedule_duplicated: 'Schedule {source} duplicated as {schedule}.'
        settings_updated: 'Settings updated.'
        season_changed: >-
            {season, select,
            winter {Season set to winter}
            summer {Season set to summer}
            other {Season set to off}}
        notifications_updated: 'Notification settings updated.'
        restored: >-
            Configuration restored from a backup: {rooms, plural, =0 {no room} one {# room} other {# rooms}},
            {schedules, plural, =0 {no schedule} one {# schedule} other {# schedules}} and
            {presets, plural, =0 {no preset} one {# preset} other {# presets}}.
    connection:
        lost: 'Connection to Home Assistant lost.'
        restored: 'Connection to Home Assistant restored.'
    alert:
        opened: 'Alert {key} opened ({type}).'
        resolved: 'Alert {key} resolved ({type}).'
    notification:
        sent: 'Notification {type} sent to {target}.'
        failed: 'Notification {type} to {target} failed: {error}'
    override:
        boost_started: >-
            {mode, select,
            cool {Boost: target lowered by {delta, number} °C until {until}}
            other {Boost: target raised by {delta, number} °C until {until}}}
        manual_started: >-
            {mode, select,
            off {Manual setting kept: switched off until {until}}
            heat {Manual setting kept: heating at {target, number} °C until {until}}
            cool {Manual setting kept: cooling at {target, number} °C until {until}}
            other {Manual setting kept until {until}}}
        cancelled: >-
            {type, select,
            boost {The boost was cancelled}
            manual {The manual setting was cancelled}
            other {The override was cancelled}}
