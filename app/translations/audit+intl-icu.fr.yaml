# Messages du journal d'audit (ICU MessageFormat). Les clés sont stockées en base, les paramètres dans `params`.
audit:
    engine:
        started: >-
            Moteur démarré : {rooms, plural, =0 {aucune pièce} one {# pièce} other {# pièces}} pilotée(s),
            {timers, plural, =0 {aucun minuteur} one {# minuteur} other {# minuteurs}} et
            {overrides, plural, =0 {aucune dérogation} one {# dérogation} other {# dérogations}} restauré(s).
    decision:
        changed: >-
            {mode, select,
            off {Arrêt}
            heat {Chauffage réglé à {target, number} °C}
            cool {Climatisation réglée à {target, number} °C}
            other {Mode changé en {mode}}}
    command:
        sent: >-
            {mode, select,
            off {{device} éteint}
            heat {{device} réglé en chauffage à {target, number} °C}
            cool {{device} réglé en climatisation à {target, number} °C}
            other {{device} réglé en {mode}}}
        failed: 'La commande {service} sur {device} a échoué : {error}'
        deferred: 'Commande vers {device} reportée jusqu’à {until}.'
    manual_change:
        detected: 'Changement manuel sur {device} : {oldMode} {oldTemperature} → {newMode} {newTemperature}'
    evaluation:
        failed: 'La pièce n’a pas pu être évaluée : {error}'
    maintenance:
        done: >-
            Maintenance quotidienne : {audit, plural, =0 {aucune entrée d’audit} one {# entrée d’audit} other {# entrées d’audit}},
            {commands, plural, =0 {aucun journal de commandes} one {# journal de commandes} other {# journaux de commandes}} et
            {overrides, plural, =0 {aucune dérogation} one {# dérogation} other {# dérogations}} purgé(s).
    configuration:
        reloaded: >-
            Configuration rechargée : {rooms, plural, =0 {aucune pièce} one {# pièce} other {# pièces}},
            {entities, plural, =0 {aucune entité} one {# entité} other {# entités}} surveillée(s).
    connection:
        lost: 'Connexion à Home Assistant perdue.'
        restored: 'Connexion à Home Assistant rétablie.'
    alert:
        opened: 'Alerte {key} ouverte ({type}).'
        resolved: 'Alerte {key} levée ({type}).'
    notification:
        sent: 'Notification {type} envoyée à {target}.'
        failed: 'La notification {type} vers {target} a échoué : {error}'
    override:
        boost_started: >-
            {mode, select,
            cool {Boost : consigne abaissée de {delta, number} °C jusqu’à {until}}
            other {Boost : consigne relevée de {delta, number} °C jusqu’à {until}}}
        manual_started: >-
            {mode, select,
            off {Réglage manuel conservé : arrêt jusqu’à {until}}
            heat {Réglage manuel conservé : chauffage à {target, number} °C jusqu’à {until}}
            cool {Réglage manuel conservé : climatisation à {target, number} °C jusqu’à {until}}
            other {Réglage manuel conservé jusqu’à {until}}}
        cancelled: >-
            {type, select,
            boost {Le boost a été annulé}
            manual {Le réglage manuel a été annulé}
            other {La surcharge a été annulée}}
